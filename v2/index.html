<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="UX design and research portfolio.">
<title>Your Name, UX Design and Research</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171717'/%3E%3Cpath d='M9 21.5 15 10l6 11.5' stroke='%23fff' stroke-width='2.1' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style id="sheet">
/* ============================================================
   Tokens. Grounded in the Vercel design language (awesome-design-md).
   Not an official Vercel package: an inspired interpretation.
   Radius rule, applied everywhere: interactive controls 6px,
   containers and media 8px. Nothing else.
   Accent lock: one accent, --accent, used for links, focus,
   primary action, and the active chart mark. Nowhere else.
   ============================================================ */
:root{
  color-scheme:light;

  --canvas:#ffffff;
  --canvas-soft:#fafafa;
  --canvas-soft-2:#f5f5f5;
  --ink:#171717;
  --body:#4d4d4d;
  /* the reference system's mute is #888888, which is 3.54:1 on white and
     fails AA for the 12px labels it is used on. Darkened deliberately. */
  --mute:#6b6b6b;
  --hairline:#ebebeb;
  --hairline-strong:#d4d4d4;
  /* dev mode writes --accent-base only. --accent is derived per theme, so a
     custom accent still adapts instead of overriding the dark palette. */
  --accent-base:#0070f3;
  --accent:var(--accent-base);
  --accent-deep:#0761d1;
  --on-accent:#ffffff;

  /* semantic only, from the same reference system, never used as accent */
  --sev-high:#c50000;
  --sev-mid:#ab570a;

  --font-sans:"Geist",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  /* dev-mode writes these */
  --base:16px;
  --lh:1.62;
  --dscale:1;
  --micro:12px;
  --track:.02em;
  --measure:66ch;
  --maxw:1180px;
  --gap-set:48px;
  --pad-set:40px;
  --secpad-set:104px;
  --blockgap-set:40px;
  --radius-ctl:6px;
  --radius-box:8px;
  --tilemin:170px;

  --gap:min(var(--gap-set),6vw);
  --pad:min(var(--pad-set),6vw);
  --secpad:min(var(--secpad-set),14vw);
  --blockgap:min(var(--blockgap-set),8vw);

  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-in-out:cubic-bezier(.77,0,.175,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --canvas:#0a0a0a;
    --canvas-soft:#111111;
    --canvas-soft-2:#161616;
    --ink:#ededed;
    --body:#a1a1a1;
    --mute:#8a8a8a;
    --hairline:#242424;
    --hairline-strong:#383838;
    --accent:color-mix(in oklab, var(--accent-base) 62%, #dbe9ff);
    --accent-deep:#529dff;
    --on-accent:#0a0a0a;
    --sev-high:#ff6166;
    --sev-mid:#f5a623;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0a0a0a;
  --canvas-soft:#111111;
  --canvas-soft-2:#161616;
  --ink:#ededed;
  --body:#a1a1a1;
  --mute:#8a8a8a;
  --hairline:#242424;
  --hairline-strong:#383838;
  --accent:color-mix(in oklab, var(--accent-base) 62%, #dbe9ff);
  --accent-deep:#529dff;
  --on-accent:#0a0a0a;
  --sev-high:#ff6166;
  --sev-mid:#f5a623;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--canvas);
  color:var(--ink);
  font-family:var(--font-sans);
  font-size:var(--base);
  line-height:var(--lh);
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
[hidden]{display:none !important}
a{color:inherit}
dl,dd{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius-ctl)}

.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--pad)}
.measure{max-width:var(--measure)}

/* ---------- type scale ---------- */
.d-xl{font-size:calc(var(--dscale) * clamp(38px,6vw,68px));line-height:1.04;letter-spacing:-.04em;font-weight:600;margin:0}
.d-lg{font-size:calc(var(--dscale) * clamp(28px,3.6vw,40px));line-height:1.12;letter-spacing:-.032em;font-weight:600;margin:0}
.d-md{font-size:calc(var(--dscale) * clamp(21px,2.4vw,26px));line-height:1.24;letter-spacing:-.022em;font-weight:600;margin:0}
.d-sm{font-size:calc(var(--dscale) * 20px);line-height:1.4;letter-spacing:-.015em;font-weight:600;margin:0}
.lead{font-size:calc(var(--base) * 1.14);line-height:1.55;color:var(--body);margin:0}
.mono{font-family:var(--font-mono);font-size:var(--micro);letter-spacing:var(--track);color:var(--mute);line-height:1.5}
.num{font-variant-numeric:tabular-nums}

/* ---------- notice ---------- */
.notice{background:var(--canvas-soft);border-bottom:1px solid var(--hairline)}
.notice-in{display:flex;align-items:center;gap:16px;padding-block:10px}
.notice p{margin:0;font-family:var(--font-mono);font-size:var(--micro);color:var(--body);line-height:1.6}
.notice b{color:var(--ink);font-weight:500}
kbd{font-family:var(--font-mono);font-size:.92em;border:1px solid var(--hairline-strong);border-radius:4px;padding:1px 5px;color:var(--ink)}
.notice button{margin-left:auto;flex:none;border:0;background:none;cursor:pointer;font-family:var(--font-mono);font-size:var(--micro);color:var(--mute);padding:4px 0}
.notice button:hover{color:var(--ink)}

/* ---------- masthead ---------- */
.masthead{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--canvas) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--hairline)}
.masthead-in{display:flex;align-items:center;gap:24px;height:64px}
.wordmark{font-weight:600;letter-spacing:-.02em;text-decoration:none;font-size:calc(var(--base) * .97)}
nav.top{margin-left:auto;display:flex;align-items:center;gap:24px}
nav.top a{font-size:calc(var(--base) * .88);text-decoration:none;color:var(--body);position:relative;padding-block:4px;transition:color 160ms ease}
nav.top a[aria-current="page"]{color:var(--ink)}
nav.top a::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform 200ms var(--ease-out)}
nav.top a[aria-current="page"]::after{transform:scaleX(1)}
.icon-btn{border:1px solid var(--hairline-strong);background:var(--canvas);color:var(--body);cursor:pointer;font-family:var(--font-mono);font-size:var(--micro);padding:6px 10px;border-radius:var(--radius-ctl);line-height:1;transition:transform 160ms var(--ease-out),border-color 160ms ease,color 160ms ease}
.icon-btn:active{transform:scale(.97)}
.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:12px;z-index:60;background:var(--canvas);padding:10px 14px;border:1px solid var(--accent);border-radius:var(--radius-ctl)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
  font-size:calc(var(--base) * .88);font-weight:500;text-decoration:none;padding:0 18px;height:44px;
  border-radius:var(--radius-ctl);border:1px solid transparent;cursor:pointer;
  transition:transform 160ms var(--ease-out),background-color 160ms ease,border-color 160ms ease,color 160ms ease}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.btn-secondary{background:var(--canvas);color:var(--ink);border-color:var(--hairline-strong)}

/* ---------- views ---------- */
.view{display:none}
.view.on{display:block}

/* ---------- hero: asymmetric split ---------- */
.hero{padding-block:clamp(48px,7vw,88px) var(--secpad);border-bottom:1px solid var(--hairline)}
.hero-grid{display:grid;grid-template-columns:1.28fr .72fr;gap:var(--gap);align-items:center}
/* headline is capped at 2 lines on desktop: the measure and the scale are
   planned together, per the hero discipline rule */
.hero h1{max-width:28ch;font-size:calc(var(--dscale) * clamp(32px,4vw,48px))}
.hero .lead{max-width:46ch;margin-top:22px}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px}
.hero-media{border-radius:var(--radius-box);overflow:hidden;background:var(--canvas-soft-2);aspect-ratio:5/6}
.hero-media img{width:100%;height:100%;object-fit:cover}

/* ---------- sections ---------- */
.sec{padding-block:var(--secpad);border-bottom:1px solid var(--hairline)}
.sec.last{border-bottom:0}
.sec-head{margin-bottom:clamp(28px,4vw,48px)}
.sec-head .lead{margin-top:14px;max-width:52ch}

/* ---------- work: asymmetric trio (1 lead + 2) ---------- */
.work{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap)}
.work > a:first-child{grid-column:1 / -1}
.proj{text-decoration:none;display:block;transition:transform 200ms var(--ease-out)}
.proj:active{transform:scale(.995)}
.proj-media{border-radius:var(--radius-box);overflow:hidden;background:var(--canvas-soft-2);border:1px solid var(--hairline);aspect-ratio:16/10;transition:border-color 200ms ease}
.work > a:first-child .proj-media{aspect-ratio:21/9}
.proj-media img{width:100%;height:100%;object-fit:cover;transition:transform 400ms var(--ease-out)}
.proj-body{padding-top:20px}
.proj-meta{display:flex;gap:14px;margin-bottom:10px}
.proj h3{margin:0 0 10px;transition:color 160ms ease}
.proj p{margin:0 0 16px;color:var(--body);font-size:calc(var(--base) * .95);max-width:56ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-mono);font-size:calc(var(--micro) - .5px);color:var(--body);background:var(--canvas-soft);border:1px solid var(--hairline);border-radius:var(--radius-ctl);padding:4px 8px;line-height:1.3}
@media (hover:hover) and (pointer:fine){
  .proj:hover .proj-media{border-color:var(--hairline-strong)}
  .proj:hover .proj-media img{transform:scale(1.02)}
  .proj:hover h3{color:var(--accent)}
  .icon-btn:hover{color:var(--ink);border-color:var(--mute)}
  .btn-primary:hover{background:var(--body);border-color:var(--body)}
  .btn-secondary:hover{border-color:var(--mute)}
  nav.top a:hover{color:var(--ink)}
  nav.top a:hover::after{transform:scaleX(1)}
  .contact-link:hover{color:var(--accent)}
}

/* ---------- approach: vertical stack ---------- */
.stack{display:flex;flex-direction:column;gap:var(--blockgap);max-width:var(--measure)}
.stack h3{margin:0 0 10px}
.stack p{margin:0;color:var(--body)}

/* ---------- contact: editorial statement ---------- */
.contact-link{display:inline-block;text-decoration:none;font-weight:600;letter-spacing:-.03em;
  font-size:calc(var(--dscale) * clamp(24px,4vw,44px));line-height:1.15;margin-top:8px;
  transition:color 200ms ease}
.contact-aside{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:32px}
.contact-aside a{color:var(--body);text-decoration:none;font-size:calc(var(--base) * .9);border-bottom:1px solid var(--hairline-strong);padding-bottom:2px;transition:color 160ms ease,border-color 160ms ease}
.contact-aside a:hover{color:var(--ink);border-color:var(--ink)}

/* ---------- case study ---------- */
.case-head{padding-block:clamp(40px,5vw,72px) clamp(28px,3.5vw,44px)}
.case-head h1{max-width:17ch}
.case-head .lead{margin-top:20px;max-width:50ch}
.factbar{display:flex;flex-wrap:wrap;gap:24px 40px;padding-block:22px;border-block:1px solid var(--hairline);margin-top:clamp(28px,4vw,44px)}
.factbar div{display:flex;flex-direction:column;gap:4px}
.factbar dd{font-size:calc(var(--base) * .88);color:var(--ink)}
.case-media{border-radius:var(--radius-box);overflow:hidden;border:1px solid var(--hairline);aspect-ratio:21/9;background:var(--canvas-soft-2)}
.case-media img{width:100%;height:100%;object-fit:cover}
.case-body{display:flex;flex-direction:column;gap:var(--secpad);padding-block:var(--secpad)}
.block{max-width:var(--measure)}
.block h2{margin:0 0 18px}
.block p{margin:0 0 16px;color:var(--body)}
.block p:last-child{margin-bottom:0}
.block strong{color:var(--ink);font-weight:600}

/* findings: card grid, not a hairline row list */
.findings{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:none}
.finding{border:1px solid var(--hairline);border-radius:var(--radius-box);background:var(--canvas-soft);padding:20px;display:flex;flex-direction:column;gap:10px}
.finding-top{display:flex;align-items:center;gap:10px}
.sev{font-family:var(--font-mono);font-size:calc(var(--micro) - 1px);font-weight:500;border-radius:var(--radius-ctl);padding:3px 7px;line-height:1.3;border:1px solid}
.sev1{color:var(--sev-high);border-color:color-mix(in srgb,var(--sev-high) 34%,transparent)}
.sev2{color:var(--sev-mid);border-color:color-mix(in srgb,var(--sev-mid) 34%,transparent)}
.sev3{color:var(--mute);border-color:var(--hairline-strong)}
.finding p{margin:0;font-size:calc(var(--base) * .94);color:var(--ink);line-height:1.5}
.finding .ev{font-family:var(--font-mono);font-size:var(--micro);color:var(--mute);margin-top:auto;padding-top:6px}

/* quote */
blockquote{margin:0;max-width:44ch}
blockquote p{font-size:calc(var(--dscale) * clamp(20px,2.4vw,26px));line-height:1.34;letter-spacing:-.02em;font-weight:500;color:var(--ink);margin:0 0 18px}
blockquote .mark{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:3px;padding:.05em .16em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
blockquote footer{font-family:var(--font-mono);font-size:var(--micro);color:var(--mute);line-height:1.6}

/* figure + stats */
figure{margin:0;border:1px solid var(--hairline);border-radius:var(--radius-box);background:var(--canvas-soft);padding:clamp(20px,3vw,28px)}
figure svg{display:block;width:100%;height:auto}
figcaption{font-size:calc(var(--base) * .82);color:var(--mute);line-height:1.6;margin-top:16px;padding-top:14px;border-top:1px solid var(--hairline)}
.ch-grid{stroke:var(--hairline);stroke-width:1}
.ch-axis{fill:var(--mute);font-family:"Geist Mono",monospace;font-size:11px}
.ch-label{fill:var(--body);font-family:"Geist Mono",monospace;font-size:11px}
.ch-value{fill:var(--ink);font-family:"Geist Mono",monospace;font-size:14px;font-weight:500}
.ch-a{fill:var(--hairline-strong)}
.ch-b{fill:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(var(--tilemin),1fr));gap:16px;margin-top:20px}
.stat{border:1px solid var(--hairline);border-radius:var(--radius-box);padding:18px;display:flex;flex-direction:column;gap:6px}
.stat b{font-size:calc(var(--dscale) * 30px);line-height:1;letter-spacing:-.03em;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:calc(var(--base) * .82);color:var(--mute);line-height:1.45}

.nextlink{display:flex;flex-direction:column;gap:10px;text-decoration:none;padding-top:36px;border-top:1px solid var(--hairline)}
.nextlink strong{font-size:calc(var(--dscale) * clamp(20px,2.4vw,26px));letter-spacing:-.022em;font-weight:600;transition:color 160ms ease}
.nextlink:hover strong{color:var(--accent)}

/* footer */
.foot{border-top:1px solid var(--hairline);padding-block:32px 48px;margin-top:var(--secpad)}
.foot-in{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:center}
.foot-in p{margin:0}
.foot-in .end{margin-left:auto;display:flex;gap:20px;align-items:center}
.foot-in a{text-decoration:none;color:var(--mute);font-size:calc(var(--base) * .85)}
.foot-in a:hover{color:var(--ink)}
/* min target 24x24 per WCAG 2.2 SC 2.5.8 */
.devlink{background:none;border:0;padding:4px 6px;min-width:24px;min-height:24px;cursor:pointer;font-family:var(--font-mono);font-size:var(--micro);color:var(--mute)}
.devlink:hover{color:var(--accent)}

/* ---------- motion. MOTION_INTENSITY 4, transform and opacity only ---------- */
@media (prefers-reduced-motion:no-preference){
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .enter > *{animation:rise 280ms var(--ease-out) both}
  .enter > *:nth-child(1){animation-delay:0ms}
  .enter > *:nth-child(2){animation-delay:40ms}
  .enter > *:nth-child(3){animation-delay:80ms}
  .enter > *:nth-child(4){animation-delay:120ms}
  .view.on{animation:rise 200ms var(--ease-out) both}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:1ms !important;animation-duration:1ms !important;animation-iteration-count:1 !important}
}

@media (max-width:900px){
  .hero-grid{grid-template-columns:1fr}
  .hero-media{aspect-ratio:16/10;order:-1}
  .work{grid-template-columns:1fr}
  .work > a:first-child .proj-media{aspect-ratio:16/10}
  .findings{grid-template-columns:1fr}
}
@media (max-width:620px){
  .masthead-in{height:auto;flex-wrap:wrap;gap:12px 0;padding-block:14px}
  nav.top{margin-left:0;width:100%;gap:20px}
  .notice-in{flex-wrap:wrap}
  .foot-in .end{margin-left:0}
}

/* ============================================================
   DEV MODE
   ============================================================ */
body.dev [data-e]{outline:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:3px;border-radius:3px}
body.dev [data-e]:hover{outline-style:solid;background:color-mix(in srgb,var(--accent) 7%,transparent)}
body.dev [data-e]:focus{outline:2px solid var(--accent);outline-offset:3px}
body.dev .proj,body.dev .nextlink,body.dev .contact-aside a{pointer-events:none}
body.dev .proj [data-e],body.dev .nextlink [data-e],body.dev .contact-aside a [data-e]{pointer-events:auto}

#dev{position:fixed;top:0;right:0;bottom:0;width:330px;z-index:50;background:var(--canvas);
  border-left:1px solid var(--hairline-strong);display:flex;flex-direction:column;
  font-family:var(--font-mono);font-size:12px;line-height:1.5;color:var(--ink)}
#dev header{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--hairline)}
#dev header h2{margin:0;font-size:12px;font-weight:500;letter-spacing:.02em}
#dev header .x{margin-left:auto;background:none;border:0;color:var(--mute);cursor:pointer;font-size:15px;padding:4px}
#dev header .x:hover{color:var(--ink)}
.dev-body{overflow-y:auto;flex:1;padding:4px 16px 20px}
.dev-tip{margin:12px 0 4px;color:var(--mute);font-size:11px;line-height:1.6}
.dev-group{margin-top:20px}
.dev-group > h3{margin:0 0 12px;font-size:11px;color:var(--mute);font-weight:500;padding-bottom:8px;border-bottom:1px solid var(--hairline)}
.ctl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin-bottom:12px}
.ctl label{font-size:11px;color:var(--body)}
.ctl output{font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums}
.ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:0;height:18px}
.ctl select,.ctl input[type=color]{grid-column:1/-1;width:100%;font-family:var(--font-mono);font-size:12px;
  padding:7px 8px;background:var(--canvas-soft);color:var(--ink);border:1px solid var(--hairline-strong);border-radius:var(--radius-ctl)}
.ctl input[type=color]{padding:2px;height:32px;cursor:pointer}
.dev-foot{border-top:1px solid var(--hairline);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.dev-row{display:flex;gap:8px}
.dev-btn{flex:1;font-family:var(--font-mono);font-size:11px;padding:10px 8px;border:1px solid var(--hairline-strong);
  background:var(--canvas);color:var(--ink);cursor:pointer;border-radius:var(--radius-ctl);line-height:1.2;
  transition:transform 160ms var(--ease-out),border-color 160ms ease,color 160ms ease}
.dev-btn:active{transform:scale(.97)}
.dev-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.dev-btn:disabled{opacity:.4;cursor:not-allowed}
.dev-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dev-btn.primary:hover:not(:disabled){background:var(--accent-deep);border-color:var(--accent-deep);color:var(--on-accent)}
.dev-status{font-size:10.5px;color:var(--mute);min-height:1.4em;line-height:1.4}
.dev-status.ok{color:var(--accent)}
.dev-status.bad{color:var(--sev-high)}
body.dev-open{padding-right:330px}
@media (max-width:820px){
  #dev{width:auto;left:0;top:auto;height:70vh;border-left:0;border-top:1px solid var(--hairline-strong)}
  body.dev-open{padding-right:0;padding-bottom:70vh}
}
</style>
</head>

<script id="state" type="application/json">

      "sections": [
        {"kind": "prose", "h": "Context", "paras": [
          "Medication reconciliation means checking a patient's incoming medication list against what is actually prescribed on the ward. It is high stakes and high interruption. The vendor's screen had been designed from the clinical specification, which is precise about what must be checked and silent about the conditions it gets checked in.",
          "Median time on task was 7 minutes 40 seconds. Nurses were routinely printing the list and re-entering it later, which is the behaviour you see when software is losing a fight with reality."
        ]},
        {"kind": "prose", "h": "Research", "paras": [
          "Twenty-two hours of contextual inquiry across six inpatient units, including three night shifts. I shadowed, asked questions in the gaps, and timed the interruptions. The median uninterrupted working window on a night shift was <strong>ninety-four seconds</strong>. The screen needed roughly four minutes of continuous attention, with no way to save partial work.",
          "Alongside that, a cognitive walkthrough with two clinical pharmacists and a full WCAG 2.2 AA audit. The audit mattered here not as compliance paperwork but because ward lighting at night is dim and much of the staff were reading at arm's length."
        ]},
        {"kind": "findings", "h": "What we found", "items": [
          {"sev": 1, "text": "No partial save. Any interruption longer than the session timeout discarded the reconciliation in progress, so nurses batched the work onto paper first.", "ev": "Observed 17 times across 22 hours"},
          {"sev": 1, "text": "Discrepancies were flagged by row colour alone, failing SC 1.4.1 and unreadable under night-mode ward lighting.", "ev": "Audit, confirmed with 4 nurses"},
          {"sev": 2, "text": "Dose used a free-text field, so 5mg, 5 mg and 5.0mg stored as distinct values and defeated the automatic comparison.", "ev": "Walkthrough, 1,400 records sampled"},
          {"sev": 2, "text": "Touch targets on the confirm control measured 28 by 28 px, below the 44 minimum, and the task is often one-handed while holding a chart.", "ev": "SC 2.5.8, observed 9 times"}
        ]},
        {"kind": "quote", "h": "The moment it turned",
          "pre": "“I print it because ",
          "mark": "the computer forgets and I do not.",
          "post": " If I get called away halfway through, at least the paper is still in my pocket.”",
          "by": "N04, contextual inquiry on a night shift. Ward sister, nineteen years."},
        {"kind": "prose", "h": "Design response", "paras": [
          "<strong>Resumable by default.</strong> Every field commits on blur to a draft tied to the patient, not the session. Walking away became a supported state rather than a failure.",
          "<strong>Discrepancies shown three ways.</strong> A severity stripe, an icon, and text, so colour reinforces meaning instead of carrying it alone.",
          "<strong>Structured dose entry.</strong> A numeric field plus a unit selector, with the old free-text values migrated by a one-off normalisation pass.",
          "<strong>Targets rebuilt to 48 px</strong> on the confirm and flag controls, with the whole row made tappable."
        ]},

        {"kind": "prose", "h": "Context", "paras": [
          "Two previous attempts at a shared library had shipped and stalled. The received wisdom was that engineers would not use it. Before rebuilding anything, I audited what was actually in production: <strong>312 button instances across nine visual variants</strong>, four of which differed only in a 2 px corner radius."

        ]},
        {"kind": "findings", "h": "What we found", "items": [
          {"sev": 1, "text": "No single source of truth. Three artefacts claimed authority and none of them cited the others.", "ev": "11 of 11 interviews"},

          {"sev": 2, "text": "Component names in Figma did not match the names in code, so handoff spent its time on translation rather than on the design.", "ev": "Audit, confirmed in 6 interviews"},
          {"sev": 3, "text": "No changelog anyone read. Updates were announced in a Slack channel containing 12 of 40 people.", "ev": "Channel membership audit"}
        ]},

          "<strong>Names matched exactly.</strong> A one-week renaming pass so a Figma layer and a code component share a string. Unglamorous, and the highest-leverage thing we did all year.",
          "<strong>Contribution in 48 hours.</strong> A template pull request with an async review SLA, replacing the standing design-review meeting.",
          "<strong>Adoption made visible.</strong> A dashboard showing per-surface token coverage, so teams could see where they stood without anyone chasing them."
        ]},

  var dd=pts.map(function(p,idx){return (idx?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
  s+='<path d="'+dd+' L'+pts[pts.length-1][0].toFixed(1)+' 150 L'+pts[0][0].toFixed(1)+' 150 Z" fill="color-mix(in srgb, var(--accent) 12%, transparent)"></path>';
  s+='<path d="'+dd+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"></path>';
  pts.forEach(function(p,idx){
    var last=idx===pts.length-1;
    s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(last?5:3)+'" fill="var(--accent)"></circle>';
    s+='<text class="ch-label" x="'+p[0].toFixed(1)+'" y="172" text-anchor="middle">'+esc(p[2])+'</text>';});
  if(c.endDisplay) s+='<text class="ch-value" x="'+pts[pts.length-1][0].toFixed(1)+'" y="'+(pts[pts.length-1][1]-14).toFixed(1)+'" text-anchor="end">'+esc(c.endDisplay)+'</text>';
  return s+'</svg>';
}

var shell=document.getElementById('shell');
function render(){ shell.innerHTML=shellHTML(); bindShell(); route(); if(devOn) markEditable(true); }

/* ---------- routing ---------- */
function paths(){
  var m={'/':S.title,'/about':'About, '+S.site.name};
  for(var i=0;i<S.projects.length;i++) m['/p/'+S.projects[i].id]=S.projects[i].title;
  return m;
}
function route(){
  var map=paths(),p=(location.hash||'#/').replace(/^#/,'');
  if(p.charAt(0)!=='/') p='/';
  if(!Object.prototype.hasOwnProperty.call(map,p)) p='/';
  var v=shell.querySelectorAll('.view');
  for(var i=0;i<v.length;i++) v[i].classList.toggle('on', v[i].getAttribute('data-view')===p);
  var n=shell.querySelectorAll('[data-nav]');
  for(var j=0;j<n.length;j++){
    if(n[j].getAttribute('data-nav')===p) n[j].setAttribute('aria-current','page');
    else n[j].removeAttribute('aria-current');
  }
  document.title=map[p];
}
window.addEventListener('hashchange',function(){
  if((location.hash||'').indexOf('#/')!==0) return;
  route(); window.scrollTo(0,0);
});

/* ---------- theme ---------- */
var root=document.documentElement;
try{ var th=localStorage.getItem('v2.theme'); if(th==='dark'||th==='light') root.setAttribute('data-theme',th); }catch(e){}

function bindShell(){
  var tb=document.getElementById('themeBtn');
  if(tb) tb.addEventListener('click',function(){
    var c=root.getAttribute('data-theme');
    var dark=c==='dark'?true:c==='light'?false:window.matchMedia('(prefers-color-scheme: dark)').matches;
    var nx=dark?'light':'dark';
    root.setAttribute('data-theme',nx);
    try{ localStorage.setItem('v2.theme',nx); }catch(e){}
  });
  var n=document.getElementById('notice');
  try{ if(localStorage.getItem('v2.notice')==='off') n.hidden=true; }catch(e){}
  var nc=document.getElementById('noticeClose');
  if(nc) nc.addEventListener('click',function(){ n.hidden=true; try{localStorage.setItem('v2.notice','off');}catch(e){} });
  var dop=document.getElementById('devOpen');
  if(dop) dop.addEventListener('click',function(){ toggleDev(true); });
}

/* ---------- editing ---------- */
var ALLOWED={EM:1,STRONG:1,B:1,I:1,SPAN:1,A:1,BR:1};
function clean(node){
  Array.prototype.slice.call(node.childNodes).forEach(function(n){
    if(n.nodeType===3) return;
    if(n.nodeType!==1){ n.remove(); return; }
    if(!ALLOWED[n.tagName]){ while(n.firstChild) n.parentNode.insertBefore(n.firstChild,n); n.remove(); return; }
    Array.prototype.slice.call(n.attributes).forEach(function(a){
      var keep=(n.tagName==='A'&&a.name==='href')||(a.name==='class'&&a.value==='mark');
      if(!keep) n.removeAttribute(a.name);
    });
    clean(n);
  });
  return node.innerHTML;
}
var devOn=false,panel=null,statusEl=null,timer=null;
function markEditable(on){
  var n=shell.querySelectorAll('[data-e]');
  for(var i=0;i<n.length;i++){
    if(on){ n[i].setAttribute('contenteditable','true'); n[i].setAttribute('spellcheck','true'); }
    else n[i].removeAttribute('contenteditable');
  }
}
shell.addEventListener('click',function(e){
  if(!devOn||!e.target.closest) return;
  var f=e.target.closest('[data-e]');
  if(f&&f.closest('a')) e.preventDefault();
},true);
shell.addEventListener('input',function(e){
  var el=e.target.closest?e.target.closest('[data-e]'):null;
  if(!devOn||!el) return;
  set(el.getAttribute('data-e'),clean(el));
  clearTimeout(timer);
  timer=setTimeout(function(){ saveDraft(); status('Draft saved locally','ok'); },450);
});
shell.addEventListener('blur',function(e){
  var el=e.target.closest?e.target.closest('[data-e]'):null;
  if(!devOn||!el) return;
  var p=el.getAttribute('data-e'),val=get(p);
  var tw=shell.querySelectorAll('[data-e="'+p+'"]');
  for(var i=0;i<tw.length;i++) if(tw[i]!==el) tw[i].innerHTML=val;
  route();
},true);

var GROUPS=[
  {name:'Typefaces',items:[
    {k:'fontSans',t:'select',label:'Sans',opts:'sans'},
    {k:'fontMono',t:'select',label:'Mono',opts:'mono'}]},
  {name:'Text',items:[
    {k:'base',t:'range',label:'Body size',min:13,max:22,step:.5,unit:'px'},
    {k:'lh',t:'range',label:'Line height',min:1.3,max:2,step:.02,unit:''},
    {k:'dscale',t:'range',label:'Display scale',min:.7,max:1.6,step:.02,unit:'x'},
    {k:'micro',t:'range',label:'Label size',min:9,max:16,step:.5,unit:'px'},
    {k:'track',t:'range',label:'Label tracking',min:0,max:.2,step:.005,unit:'em'},
    {k:'measure',t:'range',label:'Line length',min:40,max:90,step:1,unit:'ch'}]},
  {name:'Item size',items:[
    {k:'maxw',t:'range',label:'Page width',min:800,max:1600,step:10,unit:'px'},
    {k:'tilemin',t:'range',label:'Stat tile min',min:120,max:320,step:5,unit:'px'},
    {k:'radiusCtl',t:'range',label:'Control radius',min:0,max:20,step:1,unit:'px'},
    {k:'radiusBox',t:'range',label:'Container radius',min:0,max:24,step:1,unit:'px'}]},
  {name:'Spacing',items:[
    {k:'secpad',t:'range',label:'Section padding',min:32,max:200,step:4,unit:'px'},
    {k:'gap',t:'range',label:'Column gap',min:16,max:120,step:2,unit:'px'},
    {k:'pad',t:'range',label:'Page margin',min:12,max:120,step:2,unit:'px'},
    {k:'blockgap',t:'range',label:'Block gap',min:12,max:100,step:2,unit:'px'}]},
  {name:'Colour',items:[{k:'accent',t:'color',label:'Accent'}]}
];

function status(m,k){ if(!statusEl) return; statusEl.textContent=m; statusEl.className='dev-status'+(k?' '+k:''); }

function buildPanel(){
  panel=document.createElement('aside');
  panel.id='dev';
  panel.setAttribute('aria-label','Developer mode');
  var h='<header><h2>Dev mode</h2><button class="x" type="button" id="devClose" aria-label="Close">&#10005;</button></header><div class="dev-body">'
    +'<p class="dev-tip">Click any dashed text to rewrite it. Sliders change design tokens live. Changes stay in this browser until you export.</p>';
  GROUPS.forEach(function(g){
    h+='<div class="dev-group"><h3>'+g.name+'</h3>';
    g.items.forEach(function(c){
      var v=S.settings[c.k];
      h+='<div class="ctl"><label for="c-'+c.k+'">'+c.label+'</label>';
      if(c.t==='range'){
        h+='<output id="o-'+c.k+'">'+v+(c.unit||'')+'</output>'
          +'<input type="range" id="c-'+c.k+'" data-k="'+c.k+'" data-u="'+(c.unit||'')+'" min="'+c.min+'" max="'+c.max+'" step="'+c.step+'" value="'+v+'">';
      } else if(c.t==='select'){
        h+='<span></span><select id="c-'+c.k+'" data-k="'+c.k+'">';
        Object.keys(FONTS[c.opts]).forEach(function(f){
          h+='<option value="'+esc(f)+'"'+(f===v?' selected':'')+'>'+esc(f)+'</option>';});
        h+='</select>';
      } else {
        h+='<span></span><input type="color" id="c-'+c.k+'" data-k="'+c.k+'" value="'+esc(v)+'">';
      }
      h+='</div>';
    });
    h+='</div>';
  });
  h+='</div><div class="dev-foot"><div class="dev-status" id="devStatus"></div>'
    +'<div class="dev-row"><button class="dev-btn primary" id="btnDownload">Download</button>'
    +'<button class="dev-btn" id="btnCopy">Copy HTML</button></div>'
    +'<div class="dev-row"><button class="dev-btn" id="btnReset">Reset all</button></div></div>';
  panel.innerHTML=h;
  document.body.appendChild(panel);
  statusEl=document.getElementById('devStatus');

  panel.addEventListener('input',function(e){
    var k=e.target.getAttribute('data-k');
    if(!k) return;
    var val=e.target.type==='range'?parseFloat(e.target.value):e.target.value;
    S.settings[k]=val;
    var out=document.getElementById('o-'+k);
    if(out) out.textContent=val+(e.target.getAttribute('data-u')||'');
    applySettings();
    clearTimeout(timer);
    timer=setTimeout(function(){ saveDraft(); status('Draft saved locally','ok'); },300);
  });
  document.getElementById('devClose').addEventListener('click',function(){ toggleDev(false); });
  document.getElementById('btnReset').addEventListener('click',function(){
    if(!window.confirm('Discard every text and design change?')) return;
    S=JSON.parse(JSON.stringify(DEFAULTS));
    try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
    applySettings(); render();
    panel.remove(); panel=null; buildPanel();
    status('Reset to shipped version','ok');
  });
  document.getElementById('btnDownload').addEventListener('click',function(){
    try{
      var url=URL.createObjectURL(new Blob([buildDocument()],{type:'text/html'}));
      var a=document.createElement('a');
      a.href=url; a.download='index.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); },5000);
      status('Saved index.html','ok');
    }catch(err){ status('Download blocked, use Copy HTML','bad'); }
  });
  document.getElementById('btnCopy').addEventListener('click',function(){
    var doc=buildDocument();
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(doc).then(function(){ status('Full HTML copied','ok'); },
        function(){ status('Clipboard blocked, use Download','bad'); });
    } else status('Clipboard unavailable','bad');
  });
}

function toggleDev(on){
  devOn=on;
  document.body.classList.toggle('dev',on);
  document.body.classList.toggle('dev-open',on);
  markEditable(on);
  if(on){ if(!panel) buildPanel(); else panel.hidden=false; try{localStorage.setItem('v2.dev','1');}catch(e){} }
  else if(panel){ panel.hidden=true; try{localStorage.removeItem('v2.dev');}catch(e){} }
}
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==='D'||e.key==='d')){ e.preventDefault(); toggleDev(!devOn); }
  if(e.key==='Escape'&&devOn) toggleDev(false);
});

function buildDocument(){
  var json=JSON.stringify(S,null,1).replace(/</g,'\\u003c');
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'
    +'<meta name="viewport" content="width=device-width, initial-scale=1">\n'
    +'<meta name="description" content="UX design and research portfolio.">\n'
    +'<title>'+esc(S.title)+'</title>\n'
    +'<link rel="preconnect" href="https://fonts.googleapis.com">\n'
    +'<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'
    +'<link id="fontlink" rel="stylesheet" href="'+esc(fontHref(S.settings))+'">\n'
    +'<style id="sheet">'+CSS_SRC+'<\/style>\n</head>\n<body>\n'
    +'<a class="skip" href="#main">Skip to content</a>\n<div id="shell"></div>\n'
    +'<script id="state" type="application/json">'+json+'<\/script>\n'
    +'<script id="src">'+APP_SRC+'<\/script>\n</body>\n</html>\n';
}

applySettings();
render();
try{ if(localStorage.getItem('v2.dev')==='1') toggleDev(true); }catch(e){}
})();
</script>
