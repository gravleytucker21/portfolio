<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="UX design and research portfolio.">

<style id="sheet">
:root{
  color-scheme:light;
  --paper:#F3F4F1;
  --raised:#FBFBF9;
  --ink:#15181A;
  --ink-2:#585F5B;
  --ink-3:#7E8681;
  --rule:#D9DCD5;
  --rule-strong:#BCC1B9;
  --accent-base:#1E4D42;
  --accent:var(--accent-base);
  --accent-soft:#E2EAE5;
  --accent-soft:color-mix(in oklab, var(--accent) 15%, var(--paper));
  --mark:rgba(197,160,64,.32);
  --focus:var(--accent);

  --sev1-fg:#8C2F1E; --sev1-br:#C9836F; --sev1-bg:rgba(201,131,111,.10);
  --sev2-fg:#7E5B0C; --sev2-br:#C3A254; --sev2-bg:rgba(195,162,84,.12);

  /* ---- tokens the dev panel writes ---- */
  --font-display:"Newsreader",Georgia,serif;
  --font-body:"IBM Plex Sans",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",Consolas,monospace;
  --base:16.5px;
  --lh:1.62;
  --dscale:1;
  --micro:11.5px;
  --track:.09em;
  --measure:62ch;
  --maxw:1120px;
  --rail-set:172px;
  --gap-set:56px;
  --pad-set:56px;
  --secpad-set:70px;
  --rowpad-set:32px;
  --blockgap-set:40px;
  --statmin:155px;
  --radius:0px;

  /* ---- derived, responsive ---- */
  --rail:min(var(--rail-set),24vw);
  --gap:min(var(--gap-set),7vw);
  --pad:min(var(--pad-set),6vw);
  --secpad:min(var(--secpad-set),11vw);
  --rowpad:min(var(--rowpad-set),5vw);
  --blockgap:min(var(--blockgap-set),7vw);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#101312; --raised:#171B19;
    --ink:#E9ECE7; --ink-2:#A3ABA5; --ink-3:#7E8781;
    --rule:#282D2A; --rule-strong:#3C433E;
    --accent:color-mix(in oklab, var(--accent-base) 58%, #E9F4EF);
    --accent-soft:color-mix(in oklab, var(--accent) 20%, var(--paper));
    --mark:rgba(214,178,86,.24);
    --sev1-fg:#E8A791; --sev1-br:#7A4437; --sev1-bg:rgba(232,167,145,.09);
    --sev2-fg:#E0C27C; --sev2-br:#6E5A2C; --sev2-bg:rgba(224,194,124,.09);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#101312; --raised:#171B19;
  --ink:#E9ECE7; --ink-2:#A3ABA5; --ink-3:#7E8781;
  --rule:#282D2A; --rule-strong:#3C433E;
  --accent:color-mix(in oklab, var(--accent-base) 58%, #E9F4EF);
  --accent-soft:color-mix(in oklab, var(--accent) 20%, var(--paper));
  --mark:rgba(214,178,86,.24);
  --sev1-fg:#E8A791; --sev1-br:#7A4437; --sev1-bg:rgba(232,167,145,.09);
  --sev2-fg:#E0C27C; --sev2-br:#6E5A2C; --sev2-bg:rgba(224,194,124,.09);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:var(--base);
  line-height:var(--lh);
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
[hidden]{display:none !important}
a{color:inherit}
dl,dd{margin:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}

.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--pad)}
.spread{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:var(--gap)}

.mono{font-family:var(--font-mono);font-size:var(--micro);letter-spacing:var(--track);text-transform:uppercase;color:var(--ink-3);line-height:1.5}
.num{font-variant-numeric:tabular-nums}

/* notice */
.notice{border-bottom:1px solid var(--rule);background:var(--raised)}
.notice-in{display:flex;align-items:baseline;gap:14px;padding-block:9px}
.notice p{margin:0;font-family:var(--font-mono);font-size:var(--micro);line-height:1.7;color:var(--ink-2);letter-spacing:.02em}
.notice b{color:var(--ink);font-weight:500}
.notice kbd{font-family:var(--font-mono);border:1px solid var(--rule-strong);padding:1px 5px;border-radius:3px;font-size:.92em;color:var(--ink)}
.notice button{margin-left:auto;flex:none;border:0;background:none;cursor:pointer;font-family:var(--font-mono);font-size:var(--micro);letter-spacing:var(--track);text-transform:uppercase;color:var(--ink-3);padding:2px 0}
.notice button:hover{color:var(--ink)}

/* masthead */
.masthead{border-bottom:1px solid var(--rule)}
.masthead-in{display:flex;align-items:center;gap:20px;padding-block:22px}
.wordmark{font-family:var(--font-display);font-size:calc(var(--base) * 1.27);font-weight:500;letter-spacing:-.01em;text-decoration:none;line-height:1}
.wordmark i{color:var(--ink-3);font-style:italic;font-weight:300}
nav.top{margin-left:auto;display:flex;align-items:center;gap:22px}
nav.top a{font-family:var(--font-mono);font-size:var(--micro);letter-spacing:var(--track);text-transform:uppercase;text-decoration:none;color:var(--ink-2);padding-block:4px;border-bottom:1px solid transparent}
nav.top a:hover{color:var(--ink);border-bottom-color:var(--rule-strong)}
nav.top a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tbtn{border:1px solid var(--rule-strong);background:none;color:var(--ink-2);cursor:pointer;font-family:var(--font-mono);font-size:calc(var(--micro) - .5px);letter-spacing:var(--track);text-transform:uppercase;padding:5px 9px;line-height:1;border-radius:var(--radius)}
.tbtn:hover{color:var(--ink);border-color:var(--ink-3)}

.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:12px;z-index:60;background:var(--raised);padding:8px 12px;border:1px solid var(--accent)}

.view{display:none}
.view.on{display:block}

/* hero */
.hero{padding-block:calc(var(--secpad) * 1.3) var(--secpad);border-bottom:1px solid var(--rule)}
.hero h1{font-family:var(--font-display);font-weight:300;font-size:calc(var(--dscale) * clamp(34px,5.6vw,60px));line-height:1.08;letter-spacing:-.018em;margin:0 0 26px;text-wrap:balance;max-width:19ch}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero p{margin:0;color:var(--ink-2);font-size:calc(var(--base) * 1.09);max-width:54ch}
.hero-rail{display:flex;flex-direction:column;gap:18px;padding-top:10px}
.hero-rail div{display:flex;flex-direction:column;gap:3px}
.hero-rail dd{font-size:calc(var(--base) * .82);color:var(--ink-2);line-height:1.45}

/* sections */
.sec{padding-block:var(--secpad);border-bottom:1px solid var(--rule)}
.sec.last{border-bottom:0}
.sechead{display:flex;flex-direction:column;gap:6px}
.sechead h2{font-family:var(--font-display);font-weight:400;font-size:calc(var(--dscale) * clamp(22px,2.6vw,28px));letter-spacing:-.012em;margin:0;line-height:1.2}

/* work list */
.worklist{border-top:1px solid var(--rule-strong)}
.workrow{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) auto;gap:var(--gap);align-items:start;padding-block:var(--rowpad);border-bottom:1px solid var(--rule);text-decoration:none;position:relative}
.workrow::before{content:"";position:absolute;left:0;top:-1px;height:1px;width:0;background:var(--accent);transition:width .42s cubic-bezier(.2,.7,.2,1)}
.workrow:hover::before,.workrow:focus-visible::before{width:100%}
.wr-meta{display:flex;flex-direction:column;gap:6px}
.wr-title{font-family:var(--font-display);font-weight:400;font-size:calc(var(--dscale) * clamp(21px,2.5vw,27px));letter-spacing:-.012em;line-height:1.24;margin:0 0 10px;text-wrap:balance}
.workrow:hover .wr-title{color:var(--accent)}
.wr-sum{margin:0 0 14px;color:var(--ink-2);font-size:calc(var(--base) * .94);max-width:56ch}
.methods{display:flex;flex-wrap:wrap;gap:6px}
.method{font-family:var(--font-mono);font-size:calc(var(--micro) - .5px);letter-spacing:.05em;color:var(--ink-2);border:1px solid var(--rule-strong);padding:3px 7px;line-height:1.35;white-space:nowrap;border-radius:var(--radius)}
.wr-go{font-family:var(--font-mono);font-size:var(--micro);letter-spacing:var(--track);text-transform:uppercase;color:var(--ink-3);padding-top:8px}
.workrow:hover .wr-go{color:var(--accent)}

/* prose */
.prose h3{font-family:var(--font-mono);font-size:var(--micro);letter-spacing:calc(var(--track) + .02em);text-transform:uppercase;color:var(--ink-3);font-weight:500;margin:0 0 14px}
.prose p{margin:0 0 18px;max-width:var(--measure)}
.prose p:last-child{margin-bottom:0}
.prose strong{font-weight:600}
.mark{background:var(--mark);padding:.06em .18em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.stack{display:flex;flex-direction:column;gap:var(--blockgap)}

/* case study */
.casehead{padding-block:var(--secpad) calc(var(--secpad) * .6);border-bottom:1px solid var(--rule)}
.casehead h1{font-family:var(--font-display);font-weight:300;font-size:calc(var(--dscale) * clamp(30px,4.6vw,48px));line-height:1.1;letter-spacing:-.018em;margin:14px 0 20px;text-wrap:balance;max-width:20ch}
.deck{margin:0;font-size:calc(var(--base) * 1.13);color:var(--ink-2);max-width:52ch;font-family:var(--font-display);line-height:1.5}
.caserail{position:sticky;top:24px;align-self:start;display:flex;flex-direction:column;gap:16px}
.caserail div{display:flex;flex-direction:column;gap:3px}
.caserail dd{font-size:calc(var(--base) * .79);color:var(--ink-2);line-height:1.5}

/* findings */
.findings{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.finding{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;padding-block:16px;border-bottom:1px solid var(--rule);align-items:start}
.sev{font-family:var(--font-mono);font-size:calc(var(--micro) - 1px);letter-spacing:.06em;font-weight:500;padding:3px 6px;line-height:1.3;border:1px solid;white-space:nowrap;margin-top:3px;border-radius:var(--radius)}
.sev1{color:var(--sev1-fg);border-color:var(--sev1-br);background:var(--sev1-bg)}
.sev2{color:var(--sev2-fg);border-color:var(--sev2-br);background:var(--sev2-bg)}
.sev3{color:var(--ink-2);border-color:var(--rule-strong)}
.finding p{margin:0;font-size:calc(var(--base) * .94);line-height:1.55}
.finding .ev{display:block;color:var(--ink-3);font-size:calc(var(--micro) + 1px);margin-top:5px;font-family:var(--font-mono);letter-spacing:.03em;line-height:1.5}

/* quote */
blockquote{margin:0;padding:0 0 0 20px;border-left:2px solid var(--accent);font-family:var(--font-display);font-size:calc(var(--dscale) * clamp(18px,2.1vw,22px));line-height:1.45;max-width:46ch}
blockquote p{margin:0 0 12px;max-width:none}
blockquote footer{font-family:var(--font-mono);font-size:var(--micro);letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase;line-height:1.5}

/* figures */
figure{margin:0;border:1px solid var(--rule);background:var(--raised);padding:clamp(18px,2.6vw,26px);border-radius:var(--radius)}
figure svg{display:block;width:100%;height:auto}
figcaption{font-family:var(--font-mono);font-size:var(--micro);letter-spacing:.03em;color:var(--ink-3);line-height:1.65;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.ch-grid{stroke:var(--rule);stroke-width:1}
.ch-axis{fill:var(--ink-3);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em}
.ch-label{fill:var(--ink-2);font-family:var(--font-mono);font-size:11px;letter-spacing:.06em}
.ch-value{fill:var(--ink);font-family:var(--font-mono);font-size:14px;font-weight:500}
.ch-a{fill:var(--rule-strong)}
.ch-b{fill:var(--accent)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(var(--statmin),1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:22px;border-radius:var(--radius);overflow:hidden}
.stat{background:var(--paper);padding:16px 18px;display:flex;flex-direction:column;gap:5px}
.stat b{font-family:var(--font-display);font-weight:400;font-size:calc(var(--dscale) * clamp(26px,3.4vw,34px));line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--font-mono);font-size:calc(var(--micro) - .5px);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);line-height:1.5}

/* next */
.nextlink{display:flex;flex-direction:column;gap:8px;text-decoration:none;padding-top:var(--rowpad);border-top:1px solid var(--rule-strong)}
.nextlink strong{font-family:var(--font-display);font-weight:400;font-size:calc(var(--dscale) * clamp(20px,2.4vw,26px));letter-spacing:-.012em;line-height:1.25}
.nextlink:hover strong{color:var(--accent)}

/* contact */
.contactlist{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.contactlist a{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding-block:15px;border-bottom:1px solid var(--rule);text-decoration:none}
.contactlist a:hover{color:var(--accent)}
.contactlist em{font-style:normal;font-family:var(--font-mono);font-size:var(--micro);letter-spacing:var(--track);text-transform:uppercase;color:var(--ink-3)}
.lede{margin:0 0 22px;color:var(--ink-2);max-width:var(--measure)}

/* footer */
.foot{border-top:1px solid var(--rule);padding-block:26px 44px;margin-top:var(--secpad)}
.foot-in{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:baseline}
.foot-in p{margin:0}
.foot-in .end{margin-left:auto;display:flex;gap:18px;align-items:baseline}
.foot-in a{text-decoration:none}
.foot-in a:hover{color:var(--ink)}
.devlink{background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-mono);font-size:var(--micro);letter-spacing:var(--track);text-transform:uppercase;color:var(--ink-3)}
.devlink:hover{color:var(--accent)}

@media (max-width:880px){
  .spread,.workrow{grid-template-columns:minmax(0,1fr)}
  .workrow{gap:14px}
  .wr-go{display:none}
  .wr-meta{flex-direction:row;flex-wrap:wrap;gap:6px 18px}
  .hero-rail,.caserail{flex-direction:row;flex-wrap:wrap;gap:14px 30px;position:static;padding-top:0}
  .hero-rail div,.caserail div{min-width:130px;flex:1 1 200px}
  .notice-in{flex-wrap:wrap}
  .foot-in .end{margin-left:0}
}
@media (max-width:620px){
  /* the masthead runs out of room before the wordmark should start wrapping */
  .masthead-in{flex-wrap:wrap;gap:14px 0;padding-block:18px}
  .wordmark{white-space:nowrap}
  nav.top{margin-left:0;width:100%;gap:18px}
}

/* ===================== DEV MODE ===================== */
body.dev [data-e]{outline:1px dashed color-mix(in oklab, var(--accent) 55%, transparent);outline-offset:3px;border-radius:2px}
body.dev [data-e]:hover{outline-style:solid;background:color-mix(in oklab, var(--accent) 7%, transparent)}
body.dev [data-e]:focus{outline:2px solid var(--accent);outline-offset:3px;background:color-mix(in oklab, var(--accent) 5%, transparent)}
body.dev .workrow,body.dev .nextlink,body.dev .contactlist a{pointer-events:none}
body.dev .workrow [data-e],body.dev .nextlink [data-e],body.dev .contactlist a [data-e]{pointer-events:auto}

#dev{
  position:fixed;top:0;right:0;bottom:0;width:336px;z-index:50;
  background:var(--raised);border-left:1px solid var(--rule-strong);
  display:flex;flex-direction:column;
  font-family:var(--font-mono);font-size:12px;line-height:1.5;color:var(--ink);
  box-shadow:-14px 0 40px -24px rgba(0,0,0,.5);
}
#dev header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--rule)}
#dev header h2{margin:0;font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
#dev header .x{margin-left:auto;background:none;border:0;color:var(--ink-3);cursor:pointer;font-family:inherit;font-size:15px;line-height:1;padding:4px}
#dev header .x:hover{color:var(--ink)}
.dev-body{overflow-y:auto;flex:1;padding:4px 16px 20px}
.dev-tip{margin:12px 0 4px;color:var(--ink-3);font-size:11px;line-height:1.6;letter-spacing:.02em}
.dev-group{margin-top:18px}
.dev-group > h3{margin:0 0 10px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding-bottom:7px;border-bottom:1px solid var(--rule)}
.ctl{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center;margin-bottom:11px}
.ctl label{font-size:11px;color:var(--ink-2);letter-spacing:.03em}
.ctl output{font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums}
.ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:0;height:18px}
.ctl select,.ctl input[type=color]{grid-column:1/-1;width:100%;font-family:var(--font-mono);font-size:12px;padding:6px 7px;background:var(--paper);color:var(--ink);border:1px solid var(--rule-strong);border-radius:3px}
.ctl input[type=color]{padding:2px;height:32px;cursor:pointer}
.dev-foot{border-top:1px solid var(--rule);padding:12px 16px;display:flex;flex-direction:column;gap:8px;background:var(--raised)}
.dev-row{display:flex;gap:8px}
.dev-btn{flex:1;font-family:var(--font-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:9px 8px;border:1px solid var(--rule-strong);background:var(--paper);color:var(--ink);cursor:pointer;border-radius:3px;line-height:1.2}
.dev-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.dev-btn:disabled{opacity:.4;cursor:not-allowed}
.dev-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.dev-btn.primary:hover:not(:disabled){filter:brightness(1.12);color:var(--paper)}
.dev-btn.danger:hover:not(:disabled){border-color:var(--sev1-br);color:var(--sev1-fg)}
.dev-status{font-size:10.5px;color:var(--ink-3);letter-spacing:.03em;min-height:1.4em;line-height:1.4}
.dev-status.ok{color:var(--accent)}
.dev-status.bad{color:var(--sev1-fg)}
body.dev-open{padding-right:336px}
@media (max-width:820px){
  #dev{width:auto;left:0;top:auto;height:72vh;border-left:0;border-top:1px solid var(--rule-strong)}
  body.dev-open{padding-right:0;padding-bottom:72vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

    }
    return s + '</svg>';
  }

  if(c.type === 'hbars'){
    var rows = c.items.length, base = 34, step = 50, bot = base + rows * step - 6;
    s += open(bot + 40);
    s += '<line class="ch-grid" x1="120.5" y1="18" x2="120.5" y2="' + (bot + 0.5) + '"></line>';
    for(i=0;i<rows;i++){
      var r = c.items[i], y = base + i * step, w = (r.value / c.max) * 287;
      s += '<text class="ch-label" x="110" y="' + (y + 18) + '" text-anchor="end">' + esc(r.label) + '</text>';
      s += '<rect class="ch-' + (r.tone || 'b') + '" x="121" y="' + y + '" width="' + w.toFixed(1) + '" height="26"></rect>';
      s += '<text class="ch-value" x="133" y="' + (y + 18) + '">' + esc(r.display) + '</text>';
    }
    s += '<line class="ch-grid" x1="120.5" y1="' + (bot + 0.5) + '" x2="408" y2="' + (bot + 0.5) + '"></line>';
    s += '<text class="ch-axis" x="121" y="' + (bot + 17) + '">' + esc(c.ticks[0]) + '</text>';
    s += '<text class="ch-axis" x="264" y="' + (bot + 17) + '" text-anchor="middle">' + esc(c.ticks[1]) + '</text>';
    s += '<text class="ch-axis" x="408" y="' + (bot + 17) + '" text-anchor="end">' + esc(c.ticks[2]) + '</text>';
    return s + '</svg>';
  }

  /* line */
  s += open(190);
  [150.5, 85.5, 20.5].forEach(function(y){ s += '<line class="ch-grid" x1="70" y1="' + y + '" x2="400" y2="' + y + '"></line>'; });
  [[154, c.ticks[0]], [89, c.ticks[1]], [24, c.ticks[2]]].forEach(function(t){
    s += '<text class="ch-axis" x="60" y="' + t[0] + '" text-anchor="end">' + esc(t[1]) + '</text>';
  });
  var pts = c.items.map(function(p, idx){
    var x = 70 + (310 / (c.items.length - 1)) * idx;
    var y = 150 - (p.value / c.max) * 130;
    return [x, y, p.label];
  });
  var d = pts.map(function(p, idx){ return (idx ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  s += '<path d="' + d + ' L' + pts[pts.length-1][0].toFixed(1) + ' 150 L' + pts[0][0].toFixed(1) + ' 150 Z" fill="var(--accent-soft)"></path>';
  s += '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"></path>';
  pts.forEach(function(p, idx){
    var last = idx === pts.length - 1;
    s += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (last ? 5 : 3) + '" fill="var(--accent)"></circle>';
    s += '<text class="ch-label" x="' + p[0].toFixed(1) + '" y="172" text-anchor="middle">' + esc(p[2]) + '</text>';
  });
  if(c.endDisplay){
    s += '<text class="ch-value" x="' + pts[pts.length-1][0].toFixed(1) + '" y="' + (pts[pts.length-1][1] - 13).toFixed(1) + '" text-anchor="end">' + esc(c.endDisplay) + '</text>';
  }
  return s + '</svg>';
}

/* ---------- routing ---------- */
function routeTitle(path){
  if(path === '/') return S.title;
  if(path === '/about') return 'About — ' + S.title;
  for(var i=0;i<S.projects.length;i++){
    if('/p/' + S.projects[i].id === path) return S.projects[i].title + ' — ' + S.title;
  }
  return S.title;
}
function validPath(path){
  if(path === '/' || path === '/about') return true;
  for(var i=0;i<S.projects.length;i++) if('/p/' + S.projects[i].id === path) return true;
  return false;
}
function route(){
  var path = (location.hash || '#/').replace(/^#/, '');
  if(!validPath(path)) path = '/';
  var views = shell.querySelectorAll('.view');
  for(var i=0;i<views.length;i++) views[i].classList.toggle('on', views[i].getAttribute('data-view') === path);
  var navs = shell.querySelectorAll('[data-nav]');
  for(var j=0;j<navs.length;j++){
    if(navs[j].getAttribute('data-nav') === path) navs[j].setAttribute('aria-current', 'page');
    else navs[j].removeAttribute('aria-current');
  }
  document.title = routeTitle(path);
}
window.addEventListener('hashchange', function(){ route(); window.scrollTo(0, 0); });

}

/* ---------- sanitising edited HTML ---------- */
var ALLOWED = {EM:1, STRONG:1, B:1, I:1, SPAN:1, A:1, BR:1};
function clean(node){
  var kids = Array.prototype.slice.call(node.childNodes);
  kids.forEach(function(n){
    if(n.nodeType === 3) return;
    if(n.nodeType !== 1){ n.remove(); return; }
    if(!ALLOWED[n.tagName]){
      while(n.firstChild) n.parentNode.insertBefore(n.firstChild, n);
      n.remove();
      return;
    }
    Array.prototype.slice.call(n.attributes).forEach(function(a){
      var keep = (n.tagName === 'A' && a.name === 'href') ||
                 (a.name === 'class' && a.value === 'mark');
      if(!keep) n.removeAttribute(a.name);
    });
    clean(n);
  });
  return node.innerHTML;
}

/* ---------- dev mode ---------- */

function markEditable(on){
  var nodes = shell.querySelectorAll('[data-e]');
  for(var i=0;i<nodes.length;i++){
    if(on){
      nodes[i].setAttribute('contenteditable', 'true');
      nodes[i].setAttribute('spellcheck', 'true');
    } else {
      nodes[i].removeAttribute('contenteditable');
    }
  }
}

/* in dev mode a click on editable text must place a caret, not navigate */
shell.addEventListener('click', function(e){
  if(!devOn) return;
  if(!e.target.closest) return;
  var field = e.target.closest('[data-e]');
  if(field && field.closest('a')) e.preventDefault();
}, true);

shell.addEventListener('input', function(e){
  var el = e.target.closest ? e.target.closest('[data-e]') : null;
  if(!devOn || !el) return;
  set(el.getAttribute('data-e'), clean(el));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ saveDraft(); status('Draft saved locally', 'ok'); }, 450);
});
shell.addEventListener('blur', function(e){
  var el = e.target.closest ? e.target.closest('[data-e]') : null;
  if(!devOn || !el) return;
  var path = el.getAttribute('data-e'), val = get(path);
  var twins = shell.querySelectorAll('[data-e="' + path + '"]');
  for(var i=0;i<twins.length;i++) if(twins[i] !== el) twins[i].innerHTML = val;
  document.title = routeTitle((location.hash || '#/').replace(/^#/, ''));
}, true);

function status(msg, kind){

}

function buildPanel(){
  panel = document.createElement('aside');
  panel.id = 'dev';
  panel.setAttribute('aria-label', 'Developer mode');

  var html = '<header><h2>Dev mode</h2><button class="x" type="button" id="devClose" aria-label="Close dev mode">✕</button></header><div class="dev-body">';
  html += '<p class="dev-tip">Click any dashed text on the page to rewrite it. Sliders below change the design tokens live. Everything is kept in this browser until you publish.</p>';

  GROUPS.forEach(function(g){
    html += '<div class="dev-group"><h3>' + g.name + '</h3>';
    g.items.forEach(function(c){
      var v = S.settings[c.k];
      html += '<div class="ctl"><label for="c-' + c.k + '">' + c.label + '</label>';
      if(c.t === 'range'){
        html += '<output id="o-' + c.k + '">' + v + (c.unit || '') + '</output>';
        html += '<input type="range" id="c-' + c.k + '" data-k="' + c.k + '" data-u="' + (c.unit || '') + '" min="' + c.min + '" max="' + c.max + '" step="' + c.step + '" value="' + v + '">';
      } else if(c.t === 'select'){
        html += '<span></span><select id="c-' + c.k + '" data-k="' + c.k + '">';
        Object.keys(FONTS[c.opts]).forEach(function(f){
          html += '<option value="' + esc(f) + '"' + (f === v ? ' selected' : '') + '>' + esc(f) + '</option>';
        });
        html += '</select>';
      } else {
        html += '<span></span><input type="color" id="c-' + c.k + '" data-k="' + c.k + '" value="' + esc(v) + '">';
      }
      html += '</div>';
    });
    html += '</div>';
  });

  html += '</div><div class="dev-foot"><div class="dev-status" id="devStatus"></div>' +
    '<div class="dev-row"><button class="dev-btn primary" id="btnPublish" disabled>Publish</button>' +
    '<button class="dev-btn" id="btnDownload" disabled>Download</button></div>' +
    '<div class="dev-row"><button class="dev-btn" id="btnCopy">Copy HTML</button>' +
    '<button class="dev-btn danger" id="btnReset">Reset all</button></div></div>';

  panel.innerHTML = html;
  document.body.appendChild(panel);
  statusEl = document.getElementById('devStatus');

  panel.addEventListener('input', function(e){
    var k = e.target.getAttribute('data-k');
    if(!k) return;
    var val = e.target.type === 'range' ? parseFloat(e.target.value) : e.target.value;
    S.settings[k] = val;
    var out = document.getElementById('o-' + k);
    if(out) out.textContent = val + (e.target.getAttribute('data-u') || '');
    applySettings();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ saveDraft(); status('Draft saved locally', 'ok'); }, 300);
  });

  document.getElementById('devClose').addEventListener('click', function(){ toggleDev(false); });

  document.getElementById('btnReset').addEventListener('click', function(){
    if(!window.confirm('Discard every text and design change and return to the shipped version?')) return;
    S = JSON.parse(JSON.stringify(DEFAULTS));
    try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
    applySettings();
    render();
    panel.remove(); panel = null; buildPanel();
    status('Reset to shipped version', 'ok');
  });

  document.getElementById('btnCopy').addEventListener('click', function(){
    var doc = buildDocument();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(doc).then(function(){
        status('Full HTML copied to clipboard', 'ok');
      }, function(){ status('Clipboard blocked — use Download instead', 'bad'); });
    } else {
      status('Clipboard unavailable in this view', 'bad');
    }
  });

  wireCapabilities();
}

function toggleDev(on){
  devOn = on;
  document.body.classList.toggle('dev', on);
  document.body.classList.toggle('dev-open', on);
  markEditable(on);
  if(on){
    if(!panel) buildPanel();
    else panel.hidden = false;
    try{ localStorage.setItem('fnp.dev', '1'); }catch(e){}
  } else if(panel){
    panel.hidden = true;
  }
}

document.addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'D' || e.key === 'd')){
    e.preventDefault();
    toggleDev(!devOn);
  }
  if(e.key === 'Escape' && devOn) toggleDev(false);
});

/* ---------- build the replacement document ---------- */

    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
    '<link id="fontlink" rel="stylesheet" href="' + esc(fontHref(S.settings)) + '">\n' +
    '<style id="sheet">' + CSS_SRC + '<\/style>\n' +
    '</head>\n<body>\n' +
    '<a class="skip" href="#main">Skip to content</a>\n' +
    '<div id="shell"></div>\n' +
    '<script id="state" type="application/json">' + json + '<\/script>\n' +
    '<script id="src">' + APP_SRC + '<\/script>\n' +
    '</body>\n</html>\n';
}

/* ---------- export ---------- */
/* Off claude.ai there is no downloads capability, but an ordinary
   blob download works fine — so the button always does something. */
function blobDownload(){
  try{
    var url = URL.createObjectURL(new Blob([buildDocument()], {type: 'text/html'}));
    var a = document.createElement('a');
    a.href = url;
    a.download = 'index.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
    status('Saved index.html', 'ok');
  }catch(err){
    status('Download blocked here — use Copy HTML', 'bad');
  }
}

/* ---------- runtime capabilities ---------- */
function wireCapabilities(){
  var pub = document.getElementById('btnPublish');
  var dl = document.getElementById('btnDownload');
  var saveFile = blobDownload;

  dl.disabled = false;
  dl.addEventListener('click', function(){ saveFile(); });

  if(!window.claude || typeof window.claude.use !== 'function'){
    pub.textContent = 'Publish n/a';
    pub.title = 'Publishing in place only works on claude.ai. Use Download or Copy HTML, then redeploy.';
    return;
  }

  window.claude.use('downloads').then(function(downloads){
    if(!downloads) return;
    saveFile = function(){
      status('Preparing file…');
      downloads.save({filename: 'index.html', data: buildDocument()}).then(function(){
        status('Saved to your downloads', 'ok');
      }, function(err){
        var code = err && err.code;
        if(code === 'declined') status('Save cancelled');
        else blobDownload();
      });
    };
  }, function(){});

  window.claude.use('artifact').then(function(artifact){
    if(!artifact){ pub.textContent = 'Publish n/a'; return; }
    pub.disabled = false;
    pub.addEventListener('click', function(){
      pub.disabled = true;
      status('Publishing…');
      artifact.publish(buildDocument()).then(function(){
        try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
        status('Published — reloading', 'ok');
      }, function(err){
        var code = err && err.code;
        pub.disabled = false;
        if(code === 'conflict') status('Someone else published; reloading to their version', 'bad');
        else if(code === 'not_writer' || code === 'not_granted') status('You do not have write access to this artifact', 'bad');
        else if(code === 'too_large') status('Page too large to publish', 'bad');
        else if(code === 'rate_limited') status('Rate limited — wait a moment', 'bad');
        else status('Publish failed: ' + (code || 'unknown'), 'bad');
      });
    });
  }, function(){ pub.textContent = 'Publish n/a'; });
}

/* ---------- boot ---------- */
applySettings();
render();
try{ if(localStorage.getItem('fnp.dev') === '1') toggleDev(true); }catch(e){}
})();
</script>
